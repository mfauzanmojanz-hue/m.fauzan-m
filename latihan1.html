<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Pendaftaran - SMK Bakti Nusantara 666</title>
  <!-- Menghubungkan ke Berkas External CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="main-header">
    <div class="header-container">
      <h1 class="brand-title">SMK Bakti Nusantara 666</h1>
      <nav class="main-nav">
        <a href="#">Beranda</a>
        <a href="latihan2.html">Profil</a>
        <a href="#" class="active">Pendaftaran</a>
      </nav>
    </div>
  </header>

  <!-- Konten Utama (Main & Section Semantic) -->
  <main class="main-content">
    <section class="form-section">
      <h2 class="section-title">Form Pendaftaran Siswa Baru</h2>
      <p class="section-desc">Isi formulir di bawah ini dengan data yang benar dan lengkap.</p>

      <form action="proses.php" method="post" class="custom-form">

        <!-- Input Teks & Email -->
        <div class="form-group">
          <label for="nama">Nama Lengkap</label>
          <input type="text" id="nama" name="nama" placeholder="Nama lengkap siswa" required>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="nama@email.com" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Minimal 8 karakter" required>
        </div>

        <div class="form-group">
          <label for="tgl">Tanggal Lahir</label>
          <input type="date" id="tgl" name="tanggal_lahir" required>
        </div>

        <!-- Radio Button (Pilihan Satu) -->
        <div class="form-group">
          <label class="group-label">Jenis Kelamin</label>
          <div class="radio-group">
            <label class="inline-label"><input type="radio" name="jk" value="L" required> Laki-laki</label>
            <label class="inline-label"><input type="radio" name="jk" value="P"> Perempuan</label>
          </div>
        </div>

        <!-- Select / Dropdown -->
        <div class="form-group">
          <label for="jurusan">Pilihan Jurusan</label>
          <select id="jurusan" name="jurusan" required>
            <option value="">-- Pilih Jurusan --</option>
            <option value="pplg">PPLG (Pengembangan Perangkat Lunak & Gim)</option>
            <option value="tjkt">TJKT (Teknik Jaringan Komputer & Telekomunikasi)</option>
            <option value="dkv">DKV (Desain Komunikasi Visual)</option>
          </select>
        </div>
        <!-- Textarea (Teks Panjang) -->
        <div class="form-group">
          <label for="alamat">Alamat Lengkap:</label>
          <textarea id="alamat" name="alamat" rows="4" placeholder="Alamat rumah lengkap" required></textarea>
        </div>

        <!-- Checkbox (Pilihan Banyak) -->
        <div class="form-group">
          <label class="group-label">Minat & Keahlian:</label>
          <div class="checkbox-group">
            <label class="inline-label"><input type="checkbox" name="minat" value="web"> Web Development</label>
            <label class="inline-label"><input type="checkbox" name="minat" value="game"> Game Development</label>
          </div>
        </div>

        <!-- Button (Tombol Aksi) -->
        <div class="button-group">
          <button type="submit" class="btn btn-submit">Daftar Sekarang</button>
          <button type="reset" class="btn btn-reset">Reset Form</button>
        </div>

      </form>
    </section>
  </main>

  <!-- Semantic Footer -->
  <footer class="main-footer">
    <p>&copy; 2026 SMK Bakti Nusantara 666. All Rights Reserved.</p>
  </footer>

</body>
</html>
